name: bot

# bot/ is a self-contained package, but its `verify` script reaches for the
# workspace root: `tsc` and `eslint` are root devDependencies (bot's own
# devDependencies do not carry them), and the flat eslint config lives at the
# root. Both installs are therefore required — installing bot/ alone fails.
on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - "package-lock.json"
      - ".github/workflows/bot.yml"
  pull_request:
    paths:
      - "bot/**"
      - "package-lock.json"
      - ".github/workflows/bot.yml"

concurrency:
  group: bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            bot/package-lock.json
            package-lock.json
      - name: Install workspace dependencies (tsc/eslint binaries)
        # `npm install`, not `npm ci`: the root lockfile predates this workflow
        # and has drifted from package.json (ajv 6 vs 8), so `ci` refuses.
        # Regenerating it needs registry access this sandbox does not have;
        # `install` reconciles in-flight and is enough for the two binaries the
        # bot's verify script borrows from the root.
        run: npm install --no-audit --no-fund
      - name: Install bot dependencies
        run: npm install --no-audit --no-fund
        working-directory: bot
      - name: Verify (typecheck, lint, coverage gate)
        # Output goes to a file so a failure can be summarised in a few lines:
        # the full TAP stream exceeds GitHub's per-step log budget and gets
        # truncated exactly where the failing test would be.
        run: |
          set -o pipefail
          npm run verify 2>&1 | tee verify.log
        working-directory: bot
      - name: Failure summary
        if: failure()
        run: |
          echo "=== failing tests ==="
          grep -E "^✖ |^not ok|failing tests|AssertionError|error TS|^✖" verify.log | head -40 || true
          echo "=== coverage table ==="
          grep -E "all files|below|未达标|threshold" verify.log | head -20 || true
        working-directory: bot
